<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trip360 Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#09090a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/admin/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script type="module" src="/admin/app.js"></script>
</head>
<body>
  <!-- Boot: shown until app.js decides between the key screen and the panel -->
  <div class="boot" id="boot" aria-hidden="true"><img src="/assets/icon-192.png" width="48" height="48" alt=""></div>

  <!-- Key gate -->
  <section class="gate" id="gate" hidden aria-labelledby="gate-title">
    <form class="gate-card" id="gate-form" novalidate>
      <img class="gate-icon" src="/assets/icon-192.png" width="56" height="56" alt="">
      <h1 id="gate-title">Trip360 <span>Admin</span></h1>
      <p class="gate-sub">Enter the admin key to see usage, purchases, invites and issues.</p>
      <label class="field">
        <span>Admin key</span>
        <input id="gate-key" name="admin-key" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" required>
      </label>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
      <button class="btn btn-lime btn-block" id="gate-submit" type="submit">Sign in</button>
      <p class="gate-foot">The key stays in this browser. <a href="?demo=1">Preview with sample data</a></p>
    </form>
  </section>

  <!-- Panel -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Sections">
      <div class="side-head">
        <a class="logo" href="#/overview">
          <img src="/assets/icon-192.png" width="30" height="30" alt="">
          <span>Trip<b>360</b> <em>Admin</em></span>
        </a>
        <button class="icon-btn only-mobile" id="nav-close" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <span class="demo-pill" id="demo-pill" hidden>Demo data</span>
        <button class="btn btn-ghost btn-block" id="sign-out" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
          Sign out
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <button class="icon-btn only-mobile" id="nav-open" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="title-block">
            <h1 id="page-title">Overview</h1>
            <p id="page-sub" class="page-sub"></p>
          </div>
          <div class="top-actions">
            <div class="range" id="range" role="group" aria-label="Date range"></div>
            <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
            </button>
          </div>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- User detail drawer -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <div class="drawer-id" id="drawer-id"></div>
      <button class="icon-btn" id="drawer-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
